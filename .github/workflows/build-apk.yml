name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Locate Android Project & Gradle Wrapper
        id: locate-project
        run: |
          echo "Searching for Android project and Gradle wrapper..."
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Gradle wrapper (gradlew) could not be found in this repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Detected Android project root at: $PROJECT_DIR"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          # Verify application module exists
          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ] || [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Application module detected: app"
            echo "APP_MODULE=app" >> $GITHUB_ENV
          else
            echo "::error::Application module 'app' not found in $PROJECT_DIR"
            exit 1
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x "${{ env.ANDROID_PROJECT_DIR }}/gradlew"

      - name: Clean Stale Gradle & Application Build Caches
        run: |
          echo "Removing stale caches..."
          rm -rf "${{ env.ANDROID_PROJECT_DIR }}/.gradle"
          rm -rf "${{ env.ANDROID_PROJECT_DIR }}/app/build"
          rm -rf "${{ env.ANDROID_PROJECT_DIR }}/build"

      - name: Build Debug APK with Gradle Wrapper
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: verify-apk
        run: |
          mkdir -p apk-output
          # Search for debug APKs in the application module's build output
          FOUND_APKS=$(find "${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk" -type f -name "*.apk" 2>/dev/null)

          if [ -z "$FOUND_APKS" ]; then
            # Fallback search across all build outputs
            FOUND_APKS=$(find "${{ env.ANDROID_PROJECT_DIR }}" -type f -name "*debug*.apk" 2>/dev/null)
          fi

          if [ -z "$FOUND_APKS" ]; then
            echo "::error::No generated APK files were found after build completion!"
            exit 1
          fi

          echo "Discovered APK(s):"
          for apk in $FOUND_APKS; do
            echo " - $apk ($(ls -lh "$apk" | awk '{print $5}'))"
            cp "$apk" apk-output/
          done

          echo "APK_COUNT=$(ls -1 apk-output/*.apk | wc -l)" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
